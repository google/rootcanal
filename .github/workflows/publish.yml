name: Publish Python Wheel

on:
  release:
    types: [published]

permissions: {}

jobs:
  pypi-publish:
    name: Publish Python Wheel 📦 to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set VERSION
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Fetch Python Wheel
        uses: robinraju/release-downloader@efa4cd07bd0195e6cc65e9e30c251b49ce4d3e51 # v1.8
        with:
          tag: ${{ github.ref_name }}
          fileName: rootcanal-${{ env.VERSION }}-py3-none-any.whl
          out-file-path: dist
      - name: Authenticate to OSS Exit Gate
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Stage package distributions in OSS Exit Gate Artifact Registry
        run: |
          python3 -m venv .exit-gate-venv
          .exit-gate-venv/bin/pip install --upgrade pip keyring twine keyrings.google-artifactregistry-auth
          .exit-gate-venv/bin/twine upload \
            --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/rootcanal--pypi \
            dist/*
      - name: Trigger OSS Exit Gate release
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          MANIFEST_FILE="$(mktemp)"
          echo '{"publish_all": true}' > "${MANIFEST_FILE}"
          gcloud storage cp "${MANIFEST_FILE}" \
            "gs://oss-exit-gate-prod-projects-bucket/rootcanal/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
          rm -f "${MANIFEST_FILE}"
